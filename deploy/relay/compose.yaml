services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    restart: unless-stopped
    environment:
      RDP_RELAY_PUBLIC_ORIGIN: https://${RDP_RELAY_HOST:?Set the public DNS hostname}
      RDP_RELAY_ADMIN_KEY: ${RDP_RELAY_ADMIN_KEY:?Generate a private canonical 256-bit admin key}
    volumes:
      - relay_data:/data
    networks:
      broker:
        ipv4_address: 172.30.0.3
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      # This bypasses neither transport policy nor TLS: check only the private
      # process listener, not an HTTP API that would require the public origin.
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8765),2); s.close()"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      RDP_RELAY_HOST: ${RDP_RELAY_HOST:?Set the public DNS hostname}
      RDP_RELAY_ACME_EMAIL: ${RDP_RELAY_ACME_EMAIL:?Set an ACME contact email}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internet:
      broker:
        ipv4_address: 172.30.0.2
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

networks:
  internet:
  broker:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  relay_data:
  caddy_data:
  caddy_config:
