name: rdpmonitor
description: Native RDPMonitor machine management client.
publish_to: none
version: 1.0.1+5
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  basic_utils: ^5.8.2
  crypto: ^3.0.6
  pointycastle: 4.0.0
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^19.5.0
  file_selector: ^1.0.4
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/guest-bootstrap.ps1
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
